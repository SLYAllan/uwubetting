name: Image

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/slyallan/uwubetting
      PUBLIER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v7
      - name: Le compose de Dokploy passe chaque variable que lit le bot
        run: |
          # Variables lues par le code, sauf LEAGUE_NOM : absente de la prod, elle garde
          # sa valeur par défaut (« Ligue ») ; passée vide, elle l'écraserait.
          attendu=$(grep -hoE 'environ(\.get)?[[(]"[A-Z0-9_]+"' *.py commands/*.py \
            | grep -oE '"[A-Z0-9_]+"' | tr -d '"' | grep -vx LEAGUE_NOM | sort -u)
          config=$(docker compose -f compose.dokploy.yaml config --format json)
          diff <(echo "$attendu") <(jq -r '.services.pronobot.environment | keys[]' <<< "$config" | sort)
          jq -e '.services.pronobot.image == "ghcr.io/slyallan/uwubetting:master"' <<< "$config"
          jq -e '.volumes["uwubetting-data"].external == true' <<< "$config"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: uwubetting:essai
          labels: org.opencontainers.image.source=https://github.com/SLYAllan/uwubetting
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Preuve provisoire, le contrôle voit une dépendance manquante
        run: |
          docker run --rm uwubetting:essai sh -c 'pip uninstall -qy APScheduler             && python -m compileall -q /app && echo "compileall : vert malgré le paquet retiré"'
          if docker run --rm uwubetting:essai sh -c 'pip uninstall -qy APScheduler             && python scoring.py && python db.py && python -c "import scheduler, commands"'; then
            echo "Le contrôle n'a pas vu le paquet retiré"; exit 1
          fi
      - name: Le bot charge ses modules et passe ses auto-tests dans l'image
        # compileall ne chargeait aucun module : un paquet cassé (requirements en >=)
        # laissait la CI verte. bot.py reste dehors : il lit DISCORD_TOKEN dès son chargement.
        run: docker run --rm uwubetting:essai sh -c 'python scoring.py && python db.py && python -c "import scheduler, commands"'
      - if: env.PUBLIER == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publication
        if: env.PUBLIER == 'true'
        run: |
          for tag in "${{ github.sha }}" master; do
            docker tag uwubetting:essai "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
